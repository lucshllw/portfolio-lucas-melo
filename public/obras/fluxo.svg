<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img"><title>Fluxo de automação — três etapas</title><desc>Diagrama original do estudo conceitual de Lucas Melo, versão 1.</desc><rect width="1000" height="650" fill="#050505"/><g font-family="Arial,sans-serif" fill="#F1F3F5"><text x="90" y="120" font-size="40">Um processo observável.</text><path d="M270 315H745" stroke="#A4ABB3" stroke-width="2"/><rect x="100" y="215" width="210" height="200" fill="#141619" stroke="#747E87"/><text x="130" y="295" font-size="32">01</text><text x="130" y="355" font-size="27">Entrada</text><rect x="395" y="215" width="210" height="200" fill="#141619" stroke="#747E87"/><text x="425" y="295" font-size="32">02</text><text x="425" y="355" font-size="27">Validação</text><rect x="690" y="215" width="210" height="200" fill="#141619" stroke="#747E87"/><text x="720" y="295" font-size="32">03</text><text x="720" y="355" font-size="27">Ação</text><text x="90" y="510" font-size="20" fill="#A4ABB3">Simulação local / sem serviço externo conectado</text></g></svg>